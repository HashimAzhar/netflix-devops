
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix DevOps Lab</title>
    <style>
        body {
            margin: 0;
            background: #141414;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        header {
            padding: 24px;
            color: #e50914;
            font-size: 32px;
            font-weight: bold;
        }
        main {
            padding: 100px 20px;
        }
        h1 { font-size: 42px; }
        p { color: #cccccc; font-size: 18px; }
        .status {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            border: 1px solid #46d369;
            border-radius: 6px;
            color: #46d369;
            font-weight: bold;
        }
        .details {
            margin-top: 24px;
            font-size: 14px;
            color: #999999;
        }
    </style>
</head>
<body>
    <header>NETFLIX DEVOPS LAB</header>
    <main>
        <h1>Your Docker Deployment Works!</h1>
        <p>This webpage is being served by Nginx inside a Docker container on AWS EC2.</p>

        <div class="status">CONTINUOUS DEPLOYMENT: LIVE</div>

        <p class="details">
            Deployment test — updated through GitHub and AWS Systems Manager (SSM).
        </p>
    </main>
</body>
</html>
